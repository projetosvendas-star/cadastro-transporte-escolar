function preencherSelectRotas(sel, nomes) {
  for (var i = 0; i < nomes.length; i++) {
    var opt = document.createElement("option");
    opt.value = nomes[i];
    opt.textContent = nomes[i];
    sel.appendChild(opt);
  }
}

async function carregarSelectRotas() {
  try {
    var resp = await fetch(SUPABASE_URL + "/rest/v1/rotas?select=nome,id&order=nome", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (resp.ok) {
      todasRotas = await resp.json();
    } else {
      todasRotas = [];
    }
    if (!todasRotas || !todasRotas.length) {
      todasRotas = ROTAS_PADRAO.map(function(nome, i){ return { id: i, nome: nome }; });
    }
    var sel = document.getElementById("fRota");
    sel.innerHTML = "<option value=''>Todas</option>";
    preencherSelectRotas(sel, todasRotas.map(function(r){ return r.nome; }));
  } catch(e) {
    todasRotas = ROTAS_PADRAO.map(function(nome, i){ return { id: i, nome: nome }; });
    var sel2 = document.getElementById("fRota");
    sel2.innerHTML = "<option value=''>Todas</option>";
    preencherSelectRotas(sel2, todasRotas.map(function(r){ return r.nome; }));
  }
}

function exibirErro(msg){
  document.getElementById("tabela").innerHTML = "<p class='loading'>" + msg + "</p>";
}

async function carregar(){
  var escola = document.getElementById("fEscola").value;
  var rota = document.getElementById("fRota").value;
  var ano = document.getElementById("fAno").value;
  var dataInicio = document.getElementById("fDataInicio").value;
  var dataFim = document.getElementById("fDataFim").value;

  var url = SUPABASE_URL + "/rest/v1/cadastro_transporte?select=*&order=id.desc";
  var params = [];
  if(escola) params.push("escola=eq." + encodeURIComponent(escola));
  if(rota) params.push("rota=eq." + encodeURIComponent(rota));
  if(ano) params.push("ano=eq." + encodeURIComponent(ano));
  if(dataInicio) params.push("created_at=gte." + dataInicio + "T00:00:00");
  if(dataFim) params.push("created_at=lte." + dataFim + "T23:59:59");
  if(params.length) url += "&" + params.join("&");

  try{
    var response = await fetch(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });
    if(!response.ok){
      var msg = "Erro " + response.status + " ao carregar dados.";
      try {
        var err = await response.json();
        if(err && err.message) msg += "<br>" + err.message;
        if(err && err.hint) msg += "<br><em>" + err.hint + "</em>";
      } catch(er) {}
      exibirErro(msg);
      return;
    }
    dados = await response.json();
    renderizar();
  }catch(e){
    exibirErro("Erro ao carregar dados.<br><em>" + e.message + "</em>");
  }
}

function renderizar(){
  var resumoDiv = document.getElementById("resumo");

  if(!dados.length){
    document.getElementById("tabela").innerHTML = "<p class='loading'>Nenhum registro encontrado.</p>";
    document.getElementById("total").textContent = "Total: 0 registros";
    resumoDiv.innerHTML = "";
    return;
  }

  document.getElementById("total").textContent = "Total: " + dados.length + " registro(s)";

  var escolas = {};
  var rotas = {};
  var anos = {};
  for(var i = 0; i < dados.length; i++){
    var d = dados[i];
    var e = d.escola || "Não informado";
    var r = d.rota || "Não informado";
    var a = d.ano || "Não informado";
    escolas[e] = (escolas[e]||0) + 1;
    rotas[r] = (rotas[r]||0) + 1;
    anos[a] = (anos[a]||0) + 1;
  }

  function montarResumo(titulo, obj){
    var h = "<div style='background:#f9f9f9;border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:10px;'>";
    h += "<div style='font-weight:bold;font-size:14px;margin-bottom:8px;color:#2c3e50;'>" + titulo + "</div>";
    var chaves = Object.keys(obj).sort();
    for(var k=0;k<chaves.length;k++){
      h += "<div style='display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;font-size:13px;'>";
      h += "<span>" + chaves[k] + "</span>";
      h += "<span style='font-weight:bold;color:#2980b9;'>" + obj[chaves[k]] + "</span>";
      h += "</div>";
    }
    h += "</div>";
    return h;
  }

  resumoDiv.innerHTML =
    "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;'>" +
    montarResumo("Por Escola", escolas) +
    montarResumo("Por Rota", rotas) +
    montarResumo("Por Ano Escolar", anos) +
    "</div>";

  var html = "<table><thead><tr>";
  html += "<th>#</th><th>Data</th><th>Responsável</th><th>Endereço</th><th>Aluno</th><th>Nascimento</th><th>Escola</th><th>Ano</th><th>Rota</th><th>Latitude</th><th>Longitude</th><th>Ações</th>";
  html += "</tr></thead><tbody>";

  for(var i = 0; i < dados.length; i++){
    var d = dados[i];
    var dataFormatada = "";
    if(d.created_at){
      var dt = new Date(d.created_at);
      dataFormatada = dt.toLocaleDateString("pt-BR") + " " + dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }
    html += "<tr>";
    html += "<td>" + (i+1) + "</td>";
    html += "<td>" + dataFormatada + "</td>";
    html += "<td>" + (d.responsavel||"") + "</td>";
    html += "<td>" + (d.endereco||"") + "</td>";
    html += "<td>" + (d.aluno||"") + "</td>";
    html += "<td>" + (d.nascimento||"") + "</td>";
    html += "<td>" + (d.escola||"") + "</td>";
    html += "<td>" + (d.ano||"") + "</td>";
    html += "<td>" + (d.rota||"") + "</td>";
    html += "<td>" + (d.latitude||"") + "</td>";
    html += "<td>" + (d.longitude||"") + "</td>";
    html += "<td style='white-space:nowrap'><button class='btn-editar' onclick='editar(" + i + ")'>Editar</button> <button class='btn-excluir' onclick='excluir(" + i + ")'>Excluir</button></td>";
    html += "</tr>";
  }

  html += "</tbody></table>";
  document.getElementById("tabela").innerHTML = "<div class='tabela-wrap'>" + html + "</div>";
}

function editar(idx){
  var d = dados[idx];
  var escolas = ["E.E ARTUR ANTUNES MACIEL","CEM Dr. GUILHERME","CEM PROFESSOR ORLANDO PEREIRA","EMR OSVALDO CRUZ","EMR EUCLIDES DA CUNHA","EMR VINICIOS DE MORAIS","EE. ANTONIO FRANCISCO LISBOA","ANEXA RIO PRETO","ALVARES DE AZEVEDO","CORA CORALINA","IFMT"];
  var anos = ["PRÉ I","PRÉ II","1º ANO","2º ANO","3º ANO","4º ANO","5º ANO","6º ANO","7º ANO","8º ANO","9º ANO","1º ANO ENSINO MÉDIO","2º ANO ENSINO MÉDIO","3º ANO ENSINO MÉDIO"];
  var optEscola = "";
  for(var e=0;e<escolas.length;e++) optEscola += "<option" + (d.escola===escolas[e]?" selected":"") + ">" + escolas[e] + "</option>";
  var optAno = "";
  for(var a=0;a<anos.length;a++) optAno += "<option" + (d.ano===anos[a]?" selected":"") + ">" + anos[a] + "</option>";

  var modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.id = "modalEditar";
  modal.innerHTML = "<div class='modal'>" +
    "<h2 style='margin-top:0;font-size:18px;'>Editar Registro</h2>" +
    "<label>Nome do Responsável</label><input id='eResponsavel' value='" + (d.responsavel||"").replace(/'/g,"&#39;") + "'>" +
    "<label>Fazenda / Sítio / Chácara</label><input id='eEndereco' value='" + (d.endereco||"").replace(/'/g,"&#39;") + "'>" +
    "<label>Nome do Aluno</label><input id='eAluno' value='" + (d.aluno||"").replace(/'/g,"&#39;") + "'>" +
    "<label>Data de Nascimento</label><input type='date' id='eNascimento' value='" + (d.nascimento||"") + "'>" +
    "<label>Escola</label><select id='eEscola'>" + optEscola + "</select>" +
    "<label>Ano Escolar</label><select id='eAno'>" + optAno + "</select>" +
    "<label>Rota</label><input id='eRota' value='" + (d.rota||"").replace(/'/g,"&#39;") + "'>" +
    "<label>Latitude</label><input id='eLat' value='" + (d.latitude||"") + "'>" +
    "<label>Longitude</label><input id='eLon' value='" + (d.longitude||"") + "'>" +
    "<div style='margin-top:15px;display:flex;gap:10px;'>" +
    "<button class='btn-salvar' onclick='salvarEdicao(" + d.id + ")'>Salvar</button>" +
    "<button class='btn-cancelar' onclick='fecharModal()'>Cancelar</button>" +
    "</div></div>";
  document.body.appendChild(modal);
}

function fecharModal(){
  var m = document.getElementById("modalEditar");
  if(m) m.remove();
}

async function salvarEdicao(id){
  var dadosUpdate = {
    responsavel: document.getElementById("eResponsavel").value,
    endereco: document.getElementById("eEndereco").value,
    aluno: document.getElementById("eAluno").value,
    nascimento: document.getElementById("eNascimento").value,
    escola: document.getElementById("eEscola").value,
    ano: document.getElementById("eAno").value,
    rota: document.getElementById("eRota").value,
    latitude: parseFloat(document.getElementById("eLat").value) || null,
    longitude: parseFloat(document.getElementById("eLon").value) || null
  };

  try{
    var response = await fetch(SUPABASE_URL + "/rest/v1/cadastro_transporte?id=eq." + id, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify(dadosUpdate)
    });

    if(!response.ok){
      var err = await response.text();
      alert("Erro ao salvar: " + err);
    } else {
      fecharModal();
      carregar();
    }
  }catch(e){
    alert("Erro de conexão: " + e.message);
  }
}

async function excluir(idx){
  var d = dados[idx];
  if(!confirm("Deseja excluir o registro de \"" + d.responsavel + "\" referente ao aluno \"" + d.aluno + "\"?")) return;

  try{
    var response = await fetch(SUPABASE_URL + "/rest/v1/cadastro_transporte?id=eq." + d.id, {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if(!response.ok){
      var err = await response.text();
      alert("Erro ao excluir: " + err);
    } else {
      carregar();
    }
  }catch(e){
    alert("Erro de conexão: " + e.message);
  }
}

function exportarPDF(){
  if(!dados.length){ alert("Nenhum dado para exportar."); return; }
  window.print();
}

function exportarExcel(){
  if(!dados.length){ alert("Nenhum dado para exportar."); return; }

  var csv = "\uFEFF";
  csv += "Data;Responsável;Endereço;Aluno;Nascimento;Escola;Ano;Rota;Latitude;Longitude\n";

  for(var i = 0; i < dados.length; i++){
    var d = dados[i];
    var dataFmt = "";
    if(d.created_at){
      var dt = new Date(d.created_at);
      dataFmt = dt.toLocaleDateString("pt-BR") + " " + dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }
    csv += dataFmt + ";";
    csv += (d.responsavel||"").replace(/;/g," ") + ";";
    csv += (d.endereco||"").replace(/;/g," ") + ";";
    csv += (d.aluno||"").replace(/;/g," ") + ";";
    csv += (d.nascimento||"").replace(/;/g," ") + ";";
    csv += (d.escola||"").replace(/;/g," ") + ";";
    csv += (d.ano||"").replace(/;/g," ") + ";";
    csv += (d.rota||"").replace(/;/g," ") + ";";
    csv += (d.latitude||"") + ";";
    csv += (d.longitude||"") + "\n";
  }

  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "relatorio_transporte_escolar.csv";
  link.click();
}

function abrirGerenciarRotas() {
  var html = "<div class='modal'><h2 style='margin-top:0;font-size:18px;'>Gerenciar Rotas</h2>";
  html += "<div style='margin-bottom:10px;display:flex;gap:5px;'>";
  html += "<input id='novaRotaInput' placeholder='Nova rota' style='flex:1;padding:8px;border-radius:6px;border:1px solid #ccc;font-size:13px;'>";
  html += "<button class='btn-salvar' onclick='adicionarRota()'>Adicionar</button>";
  html += "</div><div id='listaRotas'>";
  for (var i = 0; i < todasRotas.length; i++) {
    html += "<div style='display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;font-size:13px;'>";
    html += "<span>" + todasRotas[i].nome + "</span>";
    html += "<button class='btn-excluir' onclick='removerRota(" + todasRotas[i].id + ",\"" + todasRotas[i].nome.replace(/"/g,"&quot;") + "\")' style='padding:3px 8px;font-size:11px;'>Excluir</button>";
    html += "</div>";
  }
  html += "</div>";
  html += "<div style='margin-top:15px;text-align:right;'><button class='btn-cancelar' onclick='fecharModal()'>Fechar</button></div></div>";

  var overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalGerenciarRotas";

  var inner = document.createElement("div");
  inner.style = "background:white;padding:25px;border-radius:10px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;";
  inner.innerHTML = html;
  overlay.appendChild(inner);
  document.body.appendChild(overlay);
}

async function adicionarRota() {
  var nome = document.getElementById("novaRotaInput").value.trim();
  if (!nome) { alert("Digite um nome para a rota."); return; }
  try {
    var resp = await fetch(SUPABASE_URL + "/rest/v1/rotas", {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Prefer": "return=minimal" },
      body: JSON.stringify({ nome: nome })
    });
    if (!resp.ok) { var err = await resp.text(); alert("Erro: " + err); return; }
    fecharModal();
    await carregarSelectRotas();
    abrirGerenciarRotas();
  } catch(e) { alert("Erro de conexão: " + e.message); }
}

async function removerRota(id, nome) {
  if (!confirm("Excluir rota \"" + nome + "\"?")) return;
  try {
    var resp = await fetch(SUPABASE_URL + "/rest/v1/rotas?id=eq." + id, {
      method: "DELETE",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (!resp.ok) { var err = await resp.text(); alert("Erro: " + err); return; }
    fecharModal();
    await carregarSelectRotas();
    abrirGerenciarRotas();
  } catch(e) { alert("Erro de conexão: " + e.message); }
}

document.getElementById("senhaInput").addEventListener("keypress", function(e) {
  if(e.key === "Enter") document.getElementById("btnLogin").click();
});

document.getElementById("btnLogin").addEventListener("click", function() {
  var senha = document.getElementById("senhaInput").value;
  if(senha === "Mud@r2651") {
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("conteudo").style.display = "block";
    carregar();
    carregarSelectRotas();
  } else {
    document.getElementById("senhaErro").style.display = "block";
    document.getElementById("senhaInput").value = "";
    document.getElementById("senhaInput").focus();
  }
});
