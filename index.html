<!DOCTYPE html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro Transporte Escolar</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background:#eef3ff;
display:flex;
justify-content:center;
min-height:100vh;
}

.container{
max-width:700px;
width:100%;
background:white;
margin:20px;
padding:25px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.logo{
width:200px;
max-width:100%;
display:block;
margin:auto;
margin-bottom:10px;
}

h2{
text-align:center;
font-size:20px;
}

label{
font-weight:bold;
margin-top:10px;
display:block;
font-size:14px;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

.btn-gps{
background:#f39c12;
color:white;
}

.btn-enviar{
background:#27ae60;
color:white;
}

.box{
background:#eef6ff;
padding:10px;
border-radius:6px;
margin-top:10px;
font-size:14px;
word-break:break-all;
}

.mapa{
width:100%;
height:250px;
border:2px solid #27ae60;
border-radius:6px;
margin-top:10px;
display:none;
}

.msg{
margin-top:15px;
font-weight:bold;
color:green;
text-align:center;
font-size:14px;
}

.rodape{
text-align:center;
font-size:10px;
font-weight:bold;
margin-top:20px;
padding-top:10px;
border-top:1px solid #ccc;
color:#555;
}

.link-admin{
text-align:center;
margin-top:10px;
}

.link-admin a{
font-size:12px;
color:#2980b9;
text-decoration:none;
font-weight:bold;
}

@media (max-width:480px){
body{align-items:flex-start;}
.container{margin:10px;padding:15px;border-radius:8px;}
.logo{width:150px;}
h2{font-size:17px;}
label{font-size:13px;}
input,select{font-size:13px;padding:8px;}
button{font-size:14px;padding:10px;}
.box{font-size:12px;}
.mapa{height:200px;}
}

</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h2>Cadastro Transporte Escolar</h2>

<label>Nome do Responsável</label>

<label>Fazenda / Sítio / Chácara</label>

<input id="aluno">

<label>Data de Nascimento</label>
<input type="date" id="nascimento">

<label>Escola</label>

<select id="escola">

<option>E.E ARTUR ANTUNES MACIEL</option>
<option>CEM Dr. GUILHERME</option>
<option>CEM PROFESSOR ORLANDO PEREIRA</option>
<option>EMR OSVALDO CRUZ</option>
<option>EMR EUCLIDES DA CUNHA</option>
<option>EMR VINICIOS DE MORAIS</option>
<option>EE. ANTONIO FRANCISCO LISBOA</option>
<option>ANEXA RIO PRETO</option>
<option>ALVARES DE AZEVEDO</option>
<option>CORA CORALINA</option>
<option>IFMT</option>

</select>

<label>Ano Escolar</label>

<select id="ano">

<option>PRÉ I</option>
<option>PRÉ II</option>

<option>4º ANO</option>

Latitude: - <br>
Longitude: -

<iframe class="mapa" id="mapa" allowfullscreen></iframe>

<button class="btn-enviar" id="btnEnviar">Enviar Registro</button>

<div class="link-admin">
<a href="relatorios.html">Painel do Administrador</a>
</div>

<div class="rodape">
Desenvolvido pelo Departamento de Tecnologia da SME
</div>

</div>

<script>

var SUPABASE_URL = "https://nesgkzjwrhlehbtlzgta.supabase.co";
var SUPABASE_KEY = "sb_publishable_G9wIq-NNN7vd_e64g2hXaw_jfldnF2X";

var latitude = null;
var longitude = null;

var ROTAS_PADRAO = [
  "ROTA BOI BOM/RIO AZUL/PARANÁ - OSVALDO CRUZ - Nelson",
  "ROTA IRACEMA 03 - OSVALDO CRUZ - Ivanildo",
  "ROTA GLEBA RIO DO OURO/ GLEBA UNIÃO - OSVALDO CRUZ - Bruno",
  "ROTA LINHA 01/21/TERRA ROXA - Vanderson",
  "ROTA FONTANILLAS/URBANO - Rafael",
  "ROTA CAIABI/05 MENINO JESUS/LISBOA - Rony",
  "ROTA PESQUISA/URBANO - Adão",
  "ROTA LINHA 01/04/LISBOA - Ailton",
  "ROTA LINHA F/04/LISBOA - Florisvaldo",
  "ROTA LINHA 04/G/EUCLIDES - José Ribeiro",
  "ROTA LINHA 04/EUCLIDES - Geziel",
  "ROTA SETOR AEROPORTO/URBANO - Gilmar",
  "ROTA VALE DO JUINÃƒO/URBANO - Davi",
  "ROTA LINHA 09/07/LISBOA - França",
  "ROTA LINHA 08/07/LISBOA - Sebastião",
  "ROTA GLEBA RIO DO OURO/ GLEBA UNIÃO - OSVALDO CRUZ - Enoc",
  "ROTA URBANO/PADRE DUÃLIO/PALMITEIRA - Diones",
  "ROTA BR 170/VAN/URBANO - Alessandro",
  "ROTA SÃO JUSTINO/ IFMT/URBANO - Paulo",
  "ROTA BR 174/03/TERRA ROXA - Elival",
  "ROTA RIO PRETO FAZENDA AMALIA/URBANO - Rogerio",
  "ROTA LINHA J/RIO PRETO/URBANO - Welligton Jumes",
  "ROTA SHEKINAN / LINHA 01/URBANO - Jussimar Cassol",
  "ROTA BR ARIPUANÃ / PARANÁ 02 - OSVALDO CRUZ - Ildinei",
  "ROTA GLEBRA IRACEMA 01 ROTA B - OSVALDO CRUZ - Josimar",
  "ROTA IRACEMA 02 - OSVALDO CRUZ - Cleiton"
];

function preencherRotas(select, nomes) {
  for (var i = 0; i < nomes.length; i++) {
    var opt = document.createElement("option");
    opt.textContent = nomes[i];
    opt.value = nomes[i];
    select.appendChild(opt);
  }
}

async function carregarRotas() {
  var select = document.getElementById("rota");
  try {
    var resp = await fetch(SUPABASE_URL + "/rest/v1/rotas?select=nome&order=nome", {
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
    });
    if (resp.ok) {
      var rotas = await resp.json();
      if (rotas && rotas.length) { preencherRotas(select, rotas.map(function(r){ return r.nome; })); return; }
    }
    preencherRotas(select, ROTAS_PADRAO);
  } catch(e) { preencherRotas(select, ROTAS_PADRAO); }
}
carregarRotas();

document.getElementById("btnGps").addEventListener("click", function() {

  var campo = document.getElementById("local");

  if (!navigator.geolocation) {
    campo.innerHTML = "Geolocalização não suportada neste navegador";
    return;
  }

  campo.innerHTML = "Aguardando permissão de localização...";

  navigator.geolocation.getCurrentPosition(

    function(pos) {
      latitude = pos.coords.latitude;
      longitude = pos.coords.longitude;
      campo.innerHTML =
        "Latitude: " + latitude +
        "<br>Longitude: " + longitude;

      var mapa = document.getElementById("mapa");
      mapa.src = "https://maps.google.com/maps?q=" + latitude + "," + longitude + "&z=16&output=embed";
      mapa.style.display = "block";
    },

    function(err) {
      if (err.code === 1) {
        campo.innerHTML = "Permissão negada. Habilite a localização nas configurações do navegador.";
      } else if (err.code === 2) {
        campo.innerHTML = "Localização indisponível.";
      } else {
        campo.innerHTML = "Tempo esgotado. Tente novamente.";
      }
    }

  );

});

document.getElementById("btnEnviar").addEventListener("click", async function() {

  var msg = document.getElementById("msg");
  msg.innerHTML = "";

  if (latitude == null) {
    alert("Primeiro capture a localização");
    return;
  }

  var responsavel = document.getElementById("responsavel").value;
  var endereco = document.getElementById("endereco").value;
  var aluno = document.getElementById("aluno").value;
  var nascimento = document.getElementById("nascimento").value;
  var escola = document.getElementById("escola").value;
  var ano = document.getElementById("ano").value;
  var rota = document.getElementById("rota").value;

  try {

    var response = await fetch(SUPABASE_URL + "/rest/v1/cadastro_transporte", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify([{
        responsavel: responsavel,
        endereco: endereco,
        aluno: aluno,
        nascimento: nascimento,
        escola: escola,
        ano: ano,
        rota: rota,
        latitude: latitude,
        longitude: longitude
      }])
    });

    if (!response.ok) {
      var errText = await response.text();
      alert("Erro ao enviar: " + errText);
    } else {
      msg.innerHTML = "Registro enviado com sucesso!";
      document.getElementById("responsavel").value = "";
      document.getElementById("endereco").value = "";
      document.getElementById("aluno").value = "";
      document.getElementById("nascimento").value = "";
      document.getElementById("escola").selectedIndex = 0;
      document.getElementById("ano").selectedIndex = 0;
      document.getElementById("rota").selectedIndex = 0;
      latitude = null;
      longitude = null;
      document.getElementById("local").innerHTML = "Latitude: - <br>Longitude: -";
      document.getElementById("mapa").src = "";
      document.getElementById("mapa").style.display = "none";
    }

  } catch (e) {
    alert("Erro de conexão: " + e.message);
  }

});

</script>

</body>

</html>
